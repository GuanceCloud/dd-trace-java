<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>K6 压测仪表板</title>
<style>
:root{--ink:#17324d;--muted:#60758a;--line:#d8e2eb;--bg:#f4f7fa;--card:#fff;--teal:#0f9d96;--purple:#7357c6;--orange:#ee762d;--slate:#64748b;--red:#d64545;--green:#138a66}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans CJK SC","Microsoft YaHei",sans-serif}.wrap{max-width:1240px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:18px}h1{margin:0;font-size:28px}.meta{color:var(--muted);margin-top:5px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}.notice{padding:12px 15px;border-left:4px solid var(--teal);background:#eaf8f5;margin-bottom:16px}.notice.fail{border-color:var(--red);background:#fff0f0}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:10px}.card{padding:14px}.k-label{color:var(--muted);font-size:12px}.k-value{font-size:25px;font-weight:700;margin-top:5px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}.panel{padding:16px}.panel h2{font-size:16px;margin:0 0 14px}.bar-row{display:grid;grid-template-columns:128px 1fr 72px;gap:10px;align-items:center;margin:14px 0}.track{height:18px;background:#e8eef3;border-radius:4px;position:relative;overflow:hidden}.bar{height:100%;border-radius:4px}.number{text-align:right;font-variant-numeric:tabular-nums}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-size:12px}.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}.foot{color:var(--muted);font-size:12px;margin-top:12px}@media(max-width:850px){.wrap{padding:16px}.head{display:block}.tabs{margin-top:14px}.kpis{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}.bar-row{grid-template-columns:105px 1fr 64px}}@media(max-width:480px){.kpis{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<header class="head"><div><h1>K6 压测仪表板</h1><div class="meta">上海 · 独立 4C8G K6 节点 · 45 秒 × 3 轮 · 三轮中位数</div></div><div class="tabs" aria-label="选择目标RPS"><button data-rate="100">100 RPS</button><button data-rate="300" class="active">300 RPS</button><button data-rate="500">500 RPS（压力探测）</button></div></header>
<section id="notice" class="notice"></section><section id="kpis" class="kpis"></section>
<section class="charts"><div class="panel"><h2>成功吞吐（RPS）</h2><div id="throughput"></div></div><div class="panel"><h2>请求延迟 P95（ms，越低越好）</h2><div id="latency"></div></div></section>
<section class="panel"><h2>K6 指标明细</h2><div class="table-wrap"><table class="table"><thead><tr><th>方案</th><th>请求数</th><th>成功RPS</th><th>平均延迟</th><th>P95</th><th>P99</th><th>HTTP失败</th><th>K6漏发</th><th>K6 CPU均值/峰值</th><th>业务</th><th>综合</th></tr></thead><tbody id="body"></tbody></table></div><div class="foot">综合结果同时检查业务和遥测完整性；500 RPS 为压力探测档，不作为三种探针的有效性能排名。</div></section>
</main><script>
const rows=[{"rate": 100, "mode": "baseline", "label": "无探针", "requests": 4501, "successRps": 99.95, "avgMs": 31.04, "p95Ms": 32.55, "p99Ms": 36.45, "httpFailures": 0, "droppedIterations": 0, "k6CpuAvg": 0.54, "k6CpuMax": 2.26, "businessPass": true, "telemetryPass": true, "overallPass": true}, {"rate": 100, "mode": "upstream", "label": "Datadog ddtrace", "requests": 4501, "successRps": 99.95, "avgMs": 31.29, "p95Ms": 33.09, "p99Ms": 38.28, "httpFailures": 0, "droppedIterations": 0, "k6CpuAvg": 0.41, "k6CpuMax": 2.51, "businessPass": true, "telemetryPass": true, "overallPass": true}, {"rate": 100, "mode": "guance", "label": "观测云 ddtrace", "requests": 4501, "successRps": 99.95, "avgMs": 31.37, "p95Ms": 33.46, "p99Ms": 38.93, "httpFailures": 0, "droppedIterations": 0, "k6CpuAvg": 0.48, "k6CpuMax": 2.99, "businessPass": true, "telemetryPass": true, "overallPass": true}, {"rate": 100, "mode": "skywalking", "label": "SkyWalking", "requests": 4501, "successRps": 99.95, "avgMs": 31.44, "p95Ms": 33.29, "p99Ms": 39.62, "httpFailures": 0, "droppedIterations": 0, "k6CpuAvg": 0.46, "k6CpuMax": 2.49, "businessPass": true, "telemetryPass": true, "overallPass": true}, {"rate": 300, "mode": "baseline", "label": "无探针", "requests": 13500, "successRps": 299.81, "avgMs": 44.72, "p95Ms": 85.67, "p99Ms": 143.27, "httpFailures": 0, "droppedIterations": 0, "k6CpuAvg": 1.66, "k6CpuMax": 5.0, "businessPass": true, "telemetryPass": true, "overallPass": true}, {"rate": 300, "mode": "upstream", "label": "Datadog ddtrace", "requests": 13501, "successRps": 299.81, "avgMs": 49.74, "p95Ms": 99.92, "p99Ms": 150.5, "httpFailures": 0, "droppedIterations": 0, "k6CpuAvg": 1.14, "k6CpuMax": 5.72, "businessPass": true, "telemetryPass": true, "overallPass": true}, {"rate": 300, "mode": "guance", "label": "观测云 ddtrace", "requests": 13501, "successRps": 299.8, "avgMs": 54.61, "p95Ms": 106.28, "p99Ms": 160.62, "httpFailures": 0, "droppedIterations": 0, "k6CpuAvg": 0.98, "k6CpuMax": 4.77, "businessPass": true, "telemetryPass": true, "overallPass": true}, {"rate": 300, "mode": "skywalking", "label": "SkyWalking", "requests": 13501, "successRps": 299.81, "avgMs": 49.56, "p95Ms": 95.07, "p99Ms": 132.84, "httpFailures": 0, "droppedIterations": 0, "k6CpuAvg": 1.17, "k6CpuMax": 5.74, "businessPass": true, "telemetryPass": true, "overallPass": true}, {"rate": 500, "mode": "baseline", "label": "无探针", "requests": 22501, "successRps": 499.0, "avgMs": 132.64, "p95Ms": 302.35, "p99Ms": 415.08, "httpFailures": 0, "droppedIterations": 0, "k6CpuAvg": 1.85, "k6CpuMax": 7.75, "businessPass": true, "telemetryPass": true, "overallPass": true}, {"rate": 500, "mode": "upstream", "label": "Datadog ddtrace", "requests": 22501, "successRps": 498.77, "avgMs": 149.17, "p95Ms": 308.91, "p99Ms": 448.94, "httpFailures": 0, "droppedIterations": 0, "k6CpuAvg": 1.5, "k6CpuMax": 7.77, "businessPass": true, "telemetryPass": false, "overallPass": false}, {"rate": 500, "mode": "guance", "label": "观测云 ddtrace", "requests": 22501, "successRps": 498.94, "avgMs": 158.89, "p95Ms": 333.11, "p99Ms": 768.07, "httpFailures": 0, "droppedIterations": 0, "k6CpuAvg": 1.32, "k6CpuMax": 7.79, "businessPass": true, "telemetryPass": false, "overallPass": false}, {"rate": 500, "mode": "skywalking", "label": "SkyWalking", "requests": 22501, "successRps": 266.11, "avgMs": 3982.38, "p95Ms": 10482.41, "p99Ms": 29999.92, "httpFailures": 6000, "droppedIterations": 0, "k6CpuAvg": 3.79, "k6CpuMax": 96.5, "businessPass": false, "telemetryPass": true, "overallPass": false}];const colors={baseline:'var(--slate)',upstream:'var(--purple)',guance:'var(--orange)',skywalking:'var(--teal)'};
let rate=300;const fmt=n=>Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2});
function drawBars(id,data,key,max){document.getElementById(id).innerHTML=data.map(x=>`<div class="bar-row"><span>${x.label}</span><div class="track"><div class="bar" style="width:${Math.max(1,x[key]/max*100)}%;background:${colors[x.mode]}"></div></div><span class="number">${fmt(x[key])}</span></div>`).join('')}
function render(){const d=rows.filter(x=>x.rate===rate),passes=d.filter(x=>x.overallPass).length,req=Math.round(d.reduce((a,x)=>a+x.requests,0)/d.length),fails=d.reduce((a,x)=>a+x.httpFailures,0),drops=d.reduce((a,x)=>a+x.droppedIterations,0);const pressure=rate===500;const n=document.getElementById('notice');n.className='notice'+(pressure?' fail':'');n.textContent=pressure?'500 RPS 已执行但属于压力探测失败档：ddtrace 链路完整性失败，SkyWalking 业务容量失败。':'当前档位四种配置均满足业务成功与链路完整性要求。';document.getElementById('kpis').innerHTML=[['目标吞吐',rate+' RPS'],['单轮请求','约 '+fmt(req)],['HTTP失败合计',fmt(fails)],['K6漏发合计',fmt(drops)],['综合通过',passes+' / 4']].map(x=>`<div class="card"><div class="k-label">${x[0]}</div><div class="k-value">${x[1]}</div></div>`).join('');drawBars('throughput',d,'successRps',Math.max(rate*1.05,...d.map(x=>x.successRps)));drawBars('latency',d,'p95Ms',Math.max(...d.map(x=>x.p95Ms))*1.08);document.getElementById('body').innerHTML=d.map(x=>`<tr><td>${x.label}</td><td>${fmt(x.requests)}</td><td>${fmt(x.successRps)}</td><td>${fmt(x.avgMs)} ms</td><td>${fmt(x.p95Ms)} ms</td><td>${fmt(x.p99Ms)} ms</td><td>${fmt(x.httpFailures)}</td><td>${fmt(x.droppedIterations)}</td><td>${fmt(x.k6CpuAvg)}% / ${fmt(x.k6CpuMax)}%</td><td class="${x.businessPass?'ok':'bad'}">${x.businessPass?'通过':'不通过'}</td><td class="${x.overallPass?'ok':'bad'}">${x.overallPass?'通过':'不通过'}</td></tr>`).join('');document.querySelectorAll('[data-rate]').forEach(b=>b.classList.toggle('active',Number(b.dataset.rate)===rate))}
document.querySelectorAll('[data-rate]').forEach(b=>b.addEventListener('click',()=>{rate=Number(b.dataset.rate);render()}));render();
</script></body></html>
