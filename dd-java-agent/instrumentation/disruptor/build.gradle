plugins {
  id 'dd-trace-java.module.instrumentation'
}

muzzle {
  pass {
    group = "com.lmax"
    module = "disruptor"
    versions = "[3.0,)"
    assertInverse = true
  }
}

dependencies {
  testImplementation 'com.lmax:disruptor:3.4.4'
  compileOnly group: 'com.lmax', name: 'disruptor', version: '3.4.4'
}
