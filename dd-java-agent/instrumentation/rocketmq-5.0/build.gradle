plugins {
  id 'dd-trace-java.module.instrumentation'
}

muzzle {
  pass {
    group = "org.apache.rocketmq"
    module = "rocketmq-client-java"
    versions = "[5.0.0,)"
    assertInverse = true
  }
}


dependencies {
  testImplementation group: 'org.apache.rocketmq', name: 'rocketmq-client-java', version: '5.0.0'
  compileOnly group: 'org.apache.rocketmq', name: 'rocketmq-client-java', version: '5.0.0'
}


tasks.withType(Test).configureEach {
  usesService(testcontainersLimit)
}
