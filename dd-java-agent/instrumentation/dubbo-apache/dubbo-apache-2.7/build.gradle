plugins {
  id 'dd-trace-java.module.instrumentation'
}

muzzle {
  pass {
    group = "org.apache.dubbo"
    module = "dubbo"
    versions = "[2.7.0,)"
  }
}


dependencies {
  testImplementation group: 'org.apache.dubbo', name: 'dubbo', version: '2.7.0'
  compileOnly group: 'org.apache.dubbo', name: 'dubbo', version: '2.7.0'
}
