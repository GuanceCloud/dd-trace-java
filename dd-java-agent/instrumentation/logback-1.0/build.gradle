plugins {
  id 'dd-trace-java.module.instrumentation'
}

muzzle {
  pass {
    group = 'ch.qos.logback'
    module = 'logback-classic'
    versions = '[1.0.0,]'
  }
}

addTestSuiteForDir('logback15Test', 'test')

tasks.named('compileLogback15TestJava', JavaCompile) {
  configureCompiler(it, 11, JavaVersion.VERSION_1_8)
}

tasks.named('logback15Test', Test) {
  testJvmConstraints {
    minJavaVersion = JavaVersion.VERSION_11
  }
}

dependencies {
  compileOnly group: 'ch.qos.logback', name: 'logback-classic', version: '1.0.0'
  logback15TestImplementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.25'
}
