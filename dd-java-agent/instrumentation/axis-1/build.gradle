plugins {
  id 'dd-trace-java.module.instrumentation'
}

muzzle {
  pass {
    group = "org.apache.axis"
    module = "axis"
    versions = "[1.4,)"
  }
}


dependencies {
  testImplementation 'axis:axis-jaxrpc:1.4'
  testImplementation 'commons-discovery:commons-discovery:0.2'
  testImplementation 'wsdl4j:wsdl4j:1.6.2'
  testImplementation group: 'org.apache.axis', name: 'axis', version: '1.4'
  compileOnly group: 'org.apache.axis', name: 'axis', version: '1.4'
  compileOnly group: 'axis', name: 'axis-jaxrpc', version: '1.4'
}
